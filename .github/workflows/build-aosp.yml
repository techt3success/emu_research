name: AOSP emulator image build (from source)

# WALL 1 fix (runs 5/6/7/8: googlesource RESOURCE_EXHAUSTED):
#   source comes from LineageOS' GitHub manifest rewritten by
#   scripts/gen_manifest.py — every android.googlesource.com remote is
#   pointed at the Tsinghua TUNA full AOSP mirror (USTC fallback), picked
#   by an on-runner probe. No googlesource traffic.
# WALL 2 fix (disk peak 130-147GB vs ~121GB free):
#   scripts/chunked_sync.sh syncs in ~10 chunks and deletes each chunk's
#   git stores (.repo/projects + .repo/project-objects) right after its
#   checkout is verified. Peak = tree + one chunk's store + out/.
# Persistence (actions/cache is capped at 10GB/repo — a 65GB tree can never
#   be cached): the post-sync tree is split into ~2GB zstd parts and attached
#   to the rolling `src-snap-v1` release; later runs stream-restore it.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-aosp.yml', 'TRIGGER']
  workflow_dispatch: {}

concurrency:
  group: aosp-build
  cancel-in-progress: true

env:
  SNAP_TAG: src-snap-v1
  # run-13 lesson: gh infers the repo from git remotes in cwd — steps running
  # outside a git dir (runner.temp) need this pinned or `gh release` dies with
  # "failed to run git: not a git repository"
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
    steps:
      - name: Checkout (workflow + scripts only)
        uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          set +e
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet \
                      /usr/local/share/boost /usr/lib/jvm /usr/share/swift \
                      /usr/local/.ghcup /imagepack /mnt /usr/share/miniconda \
                      /usr/share/az_* /usr/local/lib/node_modules 2>/dev/null
          sudo docker image prune -af >/dev/null 2>&1
          sudo apt-get clean
          df -h /
          date +%s > "$HOME/.run_start"

      - name: Install build deps + repo tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git gnupg flex bison build-essential zip curl \
            zlib1g-dev libncurses6 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig rsync ccache \
            libssl-dev libreadline-dev zstd
          mkdir -p "$HOME/bin"
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name  "cloud-builder"
          git config --global user.email "cloud-builder@ci.local"
          git config --global color.ui false
          git config --global trace2.eventTarget false

      - name: Restore source snapshot (rolling release assets, streamed)
        id: restore
        run: |
          set -uo pipefail
          mkdir -p "$HOME/aosp"
          # gh api prints the 404 error JSON on stdout -> use gh release view for existence
          if ! gh release view "$SNAP_TAG" >/dev/null 2>&1; then
            echo "no source snapshot yet — fresh chunked sync will run"
            echo "restored=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          RELEASE=$(gh api "repos/${{ github.repository }}/releases/tags/$SNAP_TAG") \
            || { echo "DIAG: gh api failed (rc=$?)"; exit 1; }
          echo "DIAG: gh api ok, $(echo "$RELEASE" | jq '.assets | length') assets"
          # name<TAB>api-url for every asset, sorted (part-aa < part-ab ...)
          echo "$RELEASE" | jq -r '.assets | sort_by(.name) | .[] | "\(.name)\t\(.url)"' > /tmp/snap.assets \
            || { echo "DIAG: jq parse failed (jq: $(command -v jq || echo MISSING))"; exit 1; }
          META_URL=$(grep -P "^snap\.meta\t" /tmp/snap.assets | cut -f2) || true
          echo "DIAG: META_URL=${META_URL:+set}${META_URL:-EMPTY}"
          if [ -z "$META_URL" ]; then
            # run-14 rescue: 15 parts exist but meta upload died — the asset
            # list itself is trustworthy (parts uploaded+deleted atomically),
            # so reconstruct meta in-place and continue instead of re-syncing
            PARTS=$(grep -cP "^snap\.tar\.zst\.part-\w+\t" /tmp/snap.assets || true)
            if [ "$PARTS" -ge 10 ]; then
              echo "no snap.meta but $PARTS parts present — reconstructing meta from asset list"
              gh api "repos/${{ github.repository }}/releases/tags/$SNAP_TAG" \
                --jq '.assets[].name' | grep '^snap.tar.zst.part-' > /tmp/snap.meta || true
              gh release upload "$SNAP_TAG" /tmp/snap.meta --clobber
              # fresh fetch: the old $RELEASE predates the meta upload
              RELEASE=$(gh api "repos/${{ github.repository }}/releases/tags/$SNAP_TAG")
              echo "$RELEASE" | jq -r '.assets | sort_by(.name) | .[] | "\(.name)\t\(.url)"' > /tmp/snap.assets
              META_URL=$(grep -P "^snap\.meta\t" /tmp/snap.assets | cut -f2)
            fi
          fi
          if [ -z "$META_URL" ]; then
            echo "no snap.meta in snapshot — fresh chunked sync will run"
            echo "restored=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh api "$META_URL" -H "Accept: application/octet-stream" > /tmp/snap.meta
          MISSING=0
          while read -r part; do
            [ -z "$part" ] && continue
            grep -qP "^${part}\t" /tmp/snap.assets || { echo "snapshot missing part: $part"; MISSING=1; }
          done < /tmp/snap.meta
          if [ "$MISSING" = 1 ]; then
            echo "snapshot incomplete — fresh chunked sync will run"
            echo "restored=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "streaming snapshot restore ($(grep -c . /tmp/snap.meta) parts)..."
          while read -r part; do
            [ -z "$part" ] && continue
            AURL=$(grep -P "^${part}\t" /tmp/snap.assets | cut -f2)
            gh api "$AURL" -H "Accept: application/octet-stream"
          done < /tmp/snap.meta \
            | zstd -dc \
            | tar -xf - -C "$HOME/aosp" \
            || { echo "restore failed"; rm -rf "$HOME/aosp";
                 echo "restored=false" >> "$GITHUB_OUTPUT"; exit 0; }
          # extract persisted definers if the main parts lack them
          DEFS_URL=$(grep -P "^definers\.tar\.zst	" /tmp/snap.assets | cut -f2) || true  # grep rc=1 on no-match kills bash -e
          if [ -n "$DEFS_URL" ] && { [ ! -d "$HOME/aosp/platform/cts" ] || [ ! -d "$HOME/aosp/test/vts-testcase/hal" ] || [ ! -d "$HOME/aosp/test/vts" ] || [ ! -d "$HOME/aosp/test/vts-testcase/vndk" ]; }; then
            echo "extracting persisted definers..."
            gh api "$DEFS_URL" -H "Accept: application/octet-stream" | zstd -dc | tar -xf - -C "$HOME/aosp"               && echo "definers extracted" || echo "WARN: definer extract failed (build step will clone)"
          fi
          OK=1
          for p in build/envsetup.sh prebuilts/go/linux-x86/bin/go \
                   frameworks/base/Android.bp \
                   device/generic/goldfish/AndroidProducts.mk; do
            [ -e "$HOME/aosp/$p" ] || { echo "post-restore sentinel missing: $p"; OK=0; }
          done
          # clang lives in versioned dirs (run-12 lesson) — same check as chunked_sync.sh
          ls -d "$HOME/aosp"/prebuilts/clang/host/linux-x86/clang-r*/bin/clang >/dev/null 2>&1 \
            || { echo "post-restore sentinel missing: clang-r*/bin/clang"; OK=0; }
          if [ "$OK" = 1 ]; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
            df -h /
          else
            rm -rf "$HOME/aosp"; echo "restored=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Chunked sync (mirror-rewritten manifest, per-chunk git-store deletion)
        id: sync
        run: |
          cd "$HOME/aosp"
          bash "$GITHUB_WORKSPACE/scripts/chunked_sync.sh"
          df -h /
        env:
          SYNC_JOBS: "8"

      - name: Snapshot source tree to release assets (if we just synced)
        if: success() && steps.sync.outputs.synced == 'true'
        run: |
          set -uo pipefail
          FREE_GB=$(df -BG / | awk 'NR==2 {gsub(/G/,"",$4); print $4}')
          [ "$FREE_GB" -lt 8 ] && { echo "not enough disk to snapshot (${FREE_GB}G free)"; exit 0; }
          export GH_TOKEN="${{ github.token }}"
          gh release view "$SNAP_TAG" >/dev/null 2>&1 \
            || gh release create "$SNAP_TAG" -t "AOSP source snapshot" \
                 -n "Rolling synced-tree snapshot (git stores stripped). Parts are streamed into ~/aosp by the restore step."
          echo "snapshotting tree (this is the resume mechanism; actions/cache caps at 10GB)..."
          tar -C "$HOME/aosp" \
              --exclude='./out' \
              --exclude='./.repo/projects' \
              --exclude='./.repo/project-objects' \
              --exclude='./.repo/worktrees' \
              -cf - . \
            | zstd -T0 -3 \
            | split -b 1900M \
                --filter='f="$FILE"; cat >"$f" && gh release upload "$SNAP_TAG" "$f" --clobber; rc=$?; rm -f "$f"; exit $rc' \
                - snap.tar.zst.part-
          # run-14 lesson: the filter deletes each part after upload, so local
          # ls can never see them — the release asset list IS the manifest
          gh api "repos/${{ github.repository }}/releases/tags/$SNAP_TAG" --jq '.assets[].name' \
            | grep '^snap.tar.zst.part-' > /tmp/snap.meta || true
          [ -s /tmp/snap.meta ] || { echo "FATAL: no snapshot parts on release"; exit 1; }
          gh release upload "$SNAP_TAG" /tmp/snap.meta --clobber
          echo "snapshot uploaded: $(wc -l < /tmp/snap.meta) parts"
          df -h /
        working-directory: ${{ runner.temp }}

      - name: Build emulator product
        id: build
        run: |
          # NO -u: envsetup.sh reads $TOP before defining it (set -u kills AOSP shell setup)
          set -o pipefail
          cd "$HOME/aosp"
          # Soong scans ALL Android.bp globally: qcom-caf phone-SoC dirs declare
          # namespaces from vendor repos we don't ship (run: "namespace
          # vendor/qcom/opensource/commonsys-intf/display does not exist").
          # The emulator product never builds them — drop the dirs.
          rm -rf hardware/qcom-caf hardware/qcom platform_testing/tools/automotive \n                 packages/apps/DeviceDiagnostics/TradeInModeTests
          # cts_defaults / cts_error_prone_rules / mts-target-sdk-version-current
          # are DEFINED in platform/cts (trimmed from snapshot). The sweep
          # approach cascaded (swept dirs define other defaults) — restore the
          # definer instead: clone robustly (multi-source x 3 retries — runs 18/19
          # showed single-source clones flake) and PERSIST into the rolling snapshot
          clone_definer() {
            local dir="$1"; shift
            [ -d "$dir" ] && return 0
            local attempt src
            for attempt in 1 2 3; do
              for src in "$@"; do
                if git clone -q --depth=1 $src "$dir" 2>/dev/null; then
                  echo "cloned definer: $dir (attempt $attempt)"; return 0
                fi
                rm -rf "$dir"; sleep 10
              done
            done
            echo "WARN: all clone attempts failed for $dir"; return 1
          }
          clone_definer platform/cts             "-b lineage-22.2 https://github.com/LineageOS/android_cts"             "-b android-15.0.0_r1 https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/cts"             "-b android-15.0.0_r1 https://mirrors.ustc.edu.cn/aosp/platform/cts"             "-b android-15.0.0_r1 https://android.googlesource.com/platform/cts"
          clone_definer test/vts-testcase/hal             "-b android-15.0.0_r1 https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/test/vts-testcase/hal"             "https://mirrors.ustc.edu.cn/aosp/platform/test/vts-testcase/hal"             "-b android-15.0.0_r1 https://android.googlesource.com/platform/test/vts-testcase/hal"
          clone_definer test/vts             "-b android-15.0.0_r1 https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/test/vts"             "-b android-15.0.0_r1 https://mirrors.ustc.edu.cn/aosp/platform/test/vts"             "-b android-15.0.0_r1 https://android.googlesource.com/platform/test/vts"
          clone_definer test/vts-testcase/vndk             "-b android-15.0.0_r1 https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/test/vts-testcase/vndk"             "-b android-15.0.0_r1 https://android.googlesource.com/platform/test/vts-testcase/vndk"
          if [ ! -d test/vts-testcase/vndk ]; then
            # hal/treble/platform_version references vndk_utils + vts_vndk_utils — defined in the sibling vndk repo
            git clone -q --depth=1 -b android-15.0.0_r1 https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/test/vts-testcase/vndk test/vts-testcase/vndk && echo "vts-testcase/vndk cloned: r1" || { echo "WARN: vndk clone failed — removing dependents"; rm -rf test/vts-testcase/hal/treble/platform_version; }
          fi
          # persist definers into the rolling snapshot (one-time)
          if gh release view "$SNAP_TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '^definers.tar.zst$'; then
            echo "definers already persisted in snapshot"
          else
            tar -C "$HOME/aosp" -cf - platform/cts test/vts-testcase/hal test/vts test/vts-testcase/vndk 2>/dev/null               | zstd -T0 -3 > /tmp/definers.tar.zst               && gh release upload "$SNAP_TAG" /tmp/definers.tar.zst --clobber               && echo "definers.tar.zst persisted to snapshot" || echo "WARN: definer persist failed (will retry next run)"
          fi
          START=$(cat "$HOME/.run_start"); NOW=$(date +%s)
          REMAIN=$(( 350*60 - (NOW-START) ))
          if [ "$REMAIN" -lt 4200 ]; then
            echo "only ${REMAIN}s left of the job budget — deferring build to the next run (snapshot already saved)."
            touch "$HOME/.build_deferred"
            exit 0
          fi
          source build/envsetup.sh
          TARGET=""
          for t in sdk_phone64_x86_64-trunk_staging-userdebug \
                   sdk_phone64_x86_64-userdebug \
                   sdk_phone64_x86_64-trunk_staging-eng; do
            echo "trying lunch $t"
            if lunch "$t" > lunch.log 2>&1; then TARGET="$t"; break; fi
            tail -5 lunch.log || true
          done
          [ -n "$TARGET" ] || { echo "NO VALID LUNCH TARGET"; exit 1; }
          echo "=== BUILD START: $TARGET at $(date -u)"; df -h /
          ( m -j4 > build.log 2>&1; echo $? > build.rc ) &
          MPID=$!
          NINJA_SEEN=0
          while kill -0 "$MPID" 2>/dev/null; do
            sleep 120
            [ -f build.log ] || continue
            if [ "$NINJA_SEEN" = 0 ] && grep -q "ninja: Entering directory" build.log; then
              echo "=== NINJA COMPILATION STARTED at $(date -u) ==="; NINJA_SEEN=1
            fi
            grep -E "^\[ " build.log | tail -1 || true
            df -h / | tail -1
          done
          wait "$MPID" || true
          RC=$(cat build.rc 2>/dev/null || echo 1)
          echo "=== m finished rc=$RC at $(date -u)"
          tail -25 build.log
          exit "$RC"

      - name: Collect images
        if: always() && steps.build.outcome != 'skipped'
        run: |
          # a time-deferred build is a success path: no out/ expected
          if [ ! -d "$HOME/aosp/out/target" ] && [ -f "$HOME/.build_deferred" ]; then
            echo "build deferred to next run — nothing to collect"; exit 0
          fi
          OUTDIR=$(ls -d "$HOME/aosp/out/target/product"/*/ 2>/dev/null | head -1)
          echo "Product out dir: $OUTDIR"
          [ -z "$OUTDIR" ] && { echo "no product out dir"; ls -R "$HOME/aosp/out/target" 2>/dev/null | head; exit 1; }
          ls -la "$OUTDIR"
          mkdir -p "$HOME/images"
          for f in system.img vendor.img product.img system_ext.img ramdisk.img boot.img vendor_boot.img init_boot.img; do
            [ -f "$OUTDIR/$f" ] && cp "$OUTDIR/$f" "$HOME/images/" || true
          done
          cd "$HOME/images" && gzip -kf *.img 2>/dev/null || true
          ls -la "$HOME/images"

      - name: Images present?
        id: imgs
        if: always()
        run: |
          if ls "$HOME/images"/*.img.gz >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release images
        if: success() && steps.imgs.outputs.present == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aosp15-emu-v0.${{ github.run_number }}
          name: AOSP 15 emulator images (build ${{ github.run_number }})
          body: |
            Built from source: LineageOS lineage-22.2 tree (A15), mirror-synced
            (no googlesource), product sdk_phone64_x86_64-userdebug.
            Boot: replace AVD image files with these (system/vendor/product/system_ext .img)
            + use ramdisk/boot for Magisk patching (Fortress-Lite pipeline).
          files: |
            /home/runner/images/*.img.gz

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            /home/runner/aosp/build.log
            /home/runner/aosp/out/error.log
            /home/runner/aosp/sync-chunk-*.log
            /home/runner/aosp/lunch.log
          retention-days: 14
          if-no-files-found: ignore
